version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "12713:12713"
    environment:
      - BACKEND_URL=http://backend:12712  # nginx 反向代理后端地址（保持同源，Cookie 认证可用）
      - PORT=12713
    depends_on:
      - backend

    networks:
      - app-network

  backend:
    image: your-backend-image:latest  # 替换为你的后端镜像
    ports:
      - "12712:12712"
    environment:
      - NODE_ENV=production
    networks:
      - app-network

networks:
  app-network:
    driver: bridge